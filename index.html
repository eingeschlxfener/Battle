<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Serverless Battle Royale - Deluxe Edition</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; user-select: none; }
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        /* UI-Ebene */
        #ui-layer { position: absolute; width: 100%; height: 100%; display: flex; justify-content: flex-start; align-items: center; padding-left: 50px; z-index: 20; pointer-events: none; box-sizing: border-box; }
        .lobby-box { background: rgba(15, 15, 20, 0.85); backdrop-filter: blur(10px); padding: 25px; border-radius: 16px; text-align: center; max-width: 360px; width: 100%; pointer-events: auto; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0px 20px 40px rgba(0,0,0,0.8); color: white; }
        
        input, select, button { padding: 12px; margin: 8px 0; font-size: 15px; border-radius: 8px; border: none; width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.1); color: white; outline: none; }
        input[type="color"] { padding: 0; height: 45px; cursor: pointer; }
        input::placeholder { color: #aaa; }
        button { background: linear-gradient(135deg, #4488ff, #2255cc); color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: linear-gradient(135deg, #5599ff, #3366dd); transform: translateY(-1px); }

        /* Spiel-HUD */
        #game-hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 10; pointer-events: none; box-sizing: border-box; padding: 20px; }
        .hud-element { position: absolute; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); color: white; padding: 12px 18px; border-radius: 10px; font-weight: bold; font-size: 18px; border: 1px solid rgba(255,255,255,0.1); }
        #hp-ui { top: 20px; right: 20px; color: #ff4444; }
        #ammo-ui { bottom: 20px; right: 20px; color: #ffaa00; }
        #controls-hint { top: 20px; left: 20px; font-size: 14px; border-left: 4px solid #4488ff; }
        
        /* Touch Controls */
        #touch-controls { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px; display: none; pointer-events: auto; }
        .touch-btn { position: absolute; width: 45px; height: 45px; background: rgba(255,255,255,0.2); border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        #btn-w { top: 0; left: 52px; } #btn-s { bottom: 0; left: 52px; } #btn-a { top: 52px; left: 0; } #btn-d { top: 52px; right: 0; }
        #shoot-btn { position: absolute; bottom: 30px; right: 30px; width: 80px; height: 80px; background: rgba(255,68,68,0.8); border: 3px solid white; border-radius: 50%; color: white; font-weight: bold; display: none; pointer-events: auto; align-items: center; justify-content: center; }

        #player-list { list-style: none; padding: 0; font-size: 16px; margin: 15px 0; text-align: left; }
        #player-list li { padding: 10px; background: rgba(255,255,255,0.08); margin-bottom: 6px; border-radius: 6px; display: flex; align-items: center; gap: 10px; }
        .color-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; flex-shrink: 0; }
        h1, h3 { margin-top: 0; }
    </style>
</head>
<body>
    <div id="game-hud">
        <div id="controls-hint" class="hud-element">
            🎮 <b>PC-Steuerung:</b><br>
            Bewegen: <b>W, A, S, D</b><br>
            Schießen: <b>Mausklick / Leertaste</b>
        </div>
        <div id="hp-ui" class="hud-element">❤️ Leben: 100</div>
        <div id="ammo-ui" class="hud-element">⚡ Munition: 30 / 30</div>
        
        <div id="touch-controls">
            <div id="btn-w" class="touch-btn">W</div>
            <div id="btn-a" class="touch-btn">A</div>
            <div id="btn-s" class="touch-btn">S</div>
            <div id="btn-d" class="touch-btn">D</div>
        </div>
        <div id="shoot-btn" onclick="shoot()">FEUER</div>
    </div>
    
    <div id="ui-layer">
        <div id="menu" class="lobby-box">
            <h3>Battle Royale</h3>
            <input type="text" id="player-name" placeholder="Dein Spielername" maxlength="15" value="Steve">
            
            <div style="display: flex; align-items: center; justify-content: space-between; margin: 5px 0;">
                <label style="font-size: 14px; color: #ccc;">Shirt-Farbe:</label>
                <input type="color" id="player-color" value="#00aaee">
            </div>
            
            <hr style="border-color: rgba(255,255,255,0.1); margin: 15px 0;">
            
            <p style="font-size: 13px; color: #aaa; text-align: left; margin-bottom: 5px;">Eigene Lobby-ID erstellen (z.B. "Test"):</p>
            <input type="text" id="custom-host-id" placeholder="Lobby-Name (z.B. Test)">
            <button onclick="hostGame()">Lobby hosten</button>
            
            <p style="margin: 15px 0 5px 0; font-size: 13px; color: #aaa; text-align: left;">Oder Lobby beitreten:</p>
            <input type="text" id="join-id" placeholder="Lobby-Name eingeben (z.B. Test)">
            <button onclick="joinGame()" style="background: linear-gradient(135deg, #ff8800, #cc5500);">Beitreten</button>
            <p id="menu-status" style="color: #ff6666; margin: 10px 0 0 0; font-size: 14px;"></p>
        </div>

        <div id="lobby" class="lobby-box" style="display: none;">
            <h3>Lobby wartet</h3>
            <p style="font-size: 13px; color: #aaa; text-align: left; margin-bottom: 5px;">Lobby-Code zum Weitergeben:</p>
            <input type="text" id="display-id" readonly style="background: #111; color: #00ffaa; font-weight: bold; text-align: center;">
            <button onclick="copyInviteCode()" style="background: #33aa33; margin-bottom: 15px;">Code kopieren</button>

            <ul id="player-list"></ul>

            <p id="lobby-status" style="font-size: 14px; font-weight: bold; margin: 15px 0; color: #ffaa00;">Warte auf Mitspieler...</p>
            <button id="start-btn" onclick="sendStartGame()" style="display: none; background: linear-gradient(135deg, #00aa44, #007722); font-size: 18px;">Spiel starten</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <script>
        let peer, conn, isHost = false;
        let gameState = 'menu';
        
        let myData = { name: "Steve", color: "#00aaee" };
        let peerData = { name: "Wartet...", color: "#ff4444" };
        
        let myHp = 100;
        let myAmmo = 30;

        const uiLayer = document.getElementById('ui-layer');
        const menuDiv = document.getElementById('menu');
        const lobbyDiv = document.getElementById('lobby');
        const playerList = document.getElementById('player-list');
        const lobbyStatus = document.getElementById('lobby-status');
        const startBtn = document.getElementById('start-btn');
        const displayId = document.getElementById('display-id');
        const gameHud = document.getElementById('game-hud');

        window.onload = () => {
            init3DEnvironment();
        };

        document.getElementById('player-color').addEventListener('input', (e) => {
            myData.color = e.target.value;
            if (myPlayer) updateShirtColor(myPlayer, myData.color);
            if (conn && conn.open) conn.send({ type: 'profile', profile: myData });
        });

        document.getElementById('player-name').addEventListener('input', (e) => {
            myData.name = e.target.value || "Steve";
            if (conn && conn.open) conn.send({ type: 'profile', profile: myData });
        });

        function updateLobbyUI() {
            let html = `<li><span class="color-dot" style="background: ${myData.color};"></span> ${myData.name} (Du)</li>`;
            if (conn && conn.open) {
                html += `<li><span class="color-dot" style="background: ${peerData.color};"></span> ${peerData.name}</li>`;
            }
            playerList.innerHTML = html;
        }

        function copyInviteCode() {
            if (navigator.clipboard) navigator.clipboard.writeText(displayId.value);
            alert("Lobby-Code kopiert!");
        }

        function hostGame() {
            let customId = document.getElementById('custom-host-id').value.trim();
            document.getElementById('menu-status').innerText = "Erstelle Lobby...";
            isHost = true;
            gameState = 'lobby';
            if (myPlayer) { myPlayer.position.set(-1, 0, 0); myPlayer.rotation.y = 0.4; }

            // Erstelle Peer mit Wunsch-ID oder automatisch falls leer
            peer = customId ? new Peer(customId) : new Peer(); 

            peer.on('open', (id) => {
                menuDiv.style.display = 'none';
                lobbyDiv.style.display = 'block';
                displayId.value = id;
                updateLobbyUI();
                lobbyStatus.innerText = "Lobby bereit! Warte auf Freund...";
            });

            peer.on('error', (err) => {
                document.getElementById('menu-status').innerText = "ID bereits vergeben! Wähle eine andere.";
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });
        }

        function joinGame() {
            let hostId = document.getElementById('join-id').value.trim();
            if (!hostId) return document.getElementById('menu-status').innerText = "Bitte Lobby-Namen eingeben!";

            document.getElementById('menu-status').innerText = "Verbinde zur Lobby...";
            isHost = false;
            gameState = 'lobby';
            if (myPlayer) { myPlayer.position.set(1, 0, 0); myPlayer.rotation.y = -0.4; }

            peer = new Peer();
            
            peer.on('open', () => {
                conn = peer.connect(hostId);
                setupConnection();
            });

            peer.on('error', (err) => {
                document.getElementById('menu-status').innerText = "Lobby nicht gefunden!";
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                conn.send({ type: 'profile', profile: myData });
                if (!isHost) {
                    menuDiv.style.display = 'none';
                    lobbyDiv.style.display = 'block';
                    lobbyStatus.innerText = "Verbunden! Warte auf Spielstart...";
                    updateLobbyUI();
                }
            });

            conn.on('data', (data) => {
                if (data.type === 'profile') {
                    peerData = data.profile;
                    updateLobbyUI();
                    if (!otherPlayer) {
                        otherPlayer = createMinecraftCharacter(peerData.color, true);
                        otherPlayer.position.set(isHost ? 1 : -1, 0, 0);
                        otherPlayer.rotation.y = isHost ? -0.4 : 0.4;
                        scene.add(otherPlayer);
                    } else {
                        updateShirtColor(otherPlayer, peerData.color);
                    }
                    if (isHost) {
                        lobbyStatus.innerText = "Alle Spieler bereit!";
                        startBtn.style.display = 'block';
                        conn.send({ type: 'profile', profile: myData });
                    }
                } else if (data.type === 'start') {
                    startBattle();
                } else if (data.type === 'pos' && otherPlayer && gameState === 'game') {
                    otherPlayer.position.x = data.x;
                    otherPlayer.position.z = data.z;
                    otherPlayer.rotation.y = data.rot;
                    animateLimbs(otherPlayer, data.isMoving, data.time);
                } else if (data.type === 'shot') {
                    triggerShootEffect();
                } else if (data.type === 'hit') {
                    myHp = Math.max(0, myHp - 10);
                    document.getElementById('hp-ui').innerText = `❤️ Leben: ${myHp}`;
                    if(myHp <= 0) alert("Du wurdest besiegt!");
                }
            });
        }

        function sendStartGame() {
            conn.send({ type: 'start' });
            startBattle();
        }

        // --- 1000x BESSERE 3D GRAFIK & MAP ---
        let scene, camera, renderer, myPlayer, otherPlayer;
        let clock = new THREE.Clock();
        const move = { w: false, a: false, s: false, d: false };
        const obstacles = [];

        function init3DEnvironment() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a2a3a); // Abendhimmel-Atmosphäre
            scene.fog = new THREE.FogExp2(0x1a2a3a, 0.015); // Nebel für Tiefe
            
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Beleuchtung (Sonne + Schatten)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffeedd, 1.5);
            sunLight.position.set(30, 50, 30);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 150;
            const d = 40;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            // Boden (Stylische Grasfläche mit leichten Farben)
            const floorGeo = new THREE.PlaneGeometry(120, 120);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x3b7a3b, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Grosse Stadt / viele Häuser generieren
            createBuilding(-14, -14, 8, 6, 0x8b4513);
            createBuilding(14, 14, 7, 9, 0x555566);
            createBuilding(-16, 15, 6, 6, 0xa0522d);
            createBuilding(15, -15, 8, 8, 0x708090);
            createBuilding(0, -20, 10, 5, 0x6b4226);
            createBuilding(0, 20, 5, 10, 0x4a4a5a);

            // Eigenen Charakter in der Lobby-Ansicht platzieren
            myPlayer = createMinecraftCharacter(myData.color, true);
            myPlayer.position.set(2, 0, -1);
            myPlayer.rotation.y = -0.5;
            scene.add(myPlayer);

            setupControls();
            animate();
        }

        function createBuilding(x, z, width, depth, colorHex) {
            const height = 5;
            const geo = new THREE.BoxGeometry(width, height, depth);
            const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.4, metalness: 0.2 });
            const building = new THREE.Mesh(geo, mat);
            building.position.set(x, height / 2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);
            obstacles.push({ x, z, width, depth });
        }

        function createMinecraftCharacter(shirtColorHex, hasWeapon = false) {
            const group = new THREE.Group();
            const matSkin = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.5 });
            const matShirt = new THREE.MeshStandardMaterial({ color: shirtColorHex, roughness: 0.4 });
            const matPants = new THREE.MeshStandardMaterial({ color: 0x223366, roughness: 0.5 });
            const matEyes = new THREE.MeshBasicMaterial({ color: 0x000000 });

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), matSkin);
            head.position.y = 2.2; head.castShadow = true; group.add(head);

            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.05), matEyes);
            eyeL.position.set(-0.2, 2.25, 0.41); group.add(eyeL);
            const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.05), matEyes);
            eyeR.position.set(0.2, 2.25, 0.41); group.add(eyeR);

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.4), matShirt);
            torso.position.y = 1.3; torso.name = "shirt"; torso.castShadow = true; group.add(torso);

            const armGeo = new THREE.BoxGeometry(0.3, 1.0, 0.3); armGeo.translate(0, -0.4, 0);
            const leftArm = new THREE.Mesh(armGeo, matSkin); leftArm.position.set(-0.58, 1.7, 0); leftArm.castShadow = true; group.add(leftArm);
            const rightArm = new THREE.Mesh(armGeo, matSkin); rightArm.position.set(0.58, 1.7, 0); rightArm.castShadow = true; group.add(rightArm);

            const legGeo = new THREE.BoxGeometry(0.35, 1.0, 0.35); legGeo.translate(0, -0.4, 0);
            const leftLeg = new THREE.Mesh(legGeo, matPants); leftLeg.position.set(-0.2, 0.8, 0); leftLeg.castShadow = true; group.add(leftLeg);
            const rightLeg = new THREE.Mesh(legGeo, matPants); rightLeg.position.set(0.2, 0.8, 0); rightLeg.castShadow = true; group.add(rightLeg);

            if (hasWeapon) {
                const weaponGeo = new THREE.BoxGeometry(0.2, 0.2, 0.8);
                const weaponMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 });
                const weapon = new THREE.Mesh(weaponGeo, weaponMat);
                weapon.position.set(0.7, 1.2, 0.4);
                group.add(weapon);
            }

            group.userData = { leftArm, rightArm, leftLeg, rightLeg };
            return group;
        }

        function updateShirtColor(playerGroup, hexColor) {
            playerGroup.children.forEach(child => {
                if (child.name === "shirt") child.material.color.set(hexColor);
            });
        }

        function animateLimbs(characterGroup, isMoving, time) {
            const { leftArm, rightArm, leftLeg, rightLeg } = characterGroup.userData;
            if (!leftArm) return;
            if (isMoving) {
                const angle = Math.sin(time * 12) * 0.6;
                leftArm.rotation.x = angle; rightArm.rotation.x = -angle;
                leftLeg.rotation.x = -angle; rightLeg.rotation.x = angle;
            } else {
                leftArm.rotation.x = 0; rightArm.rotation.x = 0;
                leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
            }
        }

        function setupControls() {
            document.addEventListener('keydown', e => { 
                if(move.hasOwnProperty(e.key.toLowerCase())) move[e.key.toLowerCase()] = true; 
                if(e.code === 'Space' && gameState === 'game') shoot();
            });
            document.addEventListener('keyup', e => { 
                if(move.hasOwnProperty(e.key.toLowerCase())) move[e.key.toLowerCase()] = false; 
            });

            window.addEventListener('click', () => { if (gameState === 'game') shoot(); });

            ['w', 'a', 's', 'd'].forEach(k => {
                const btn = document.getElementById(`btn-${k}`);
                if(btn) {
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); move[k] = true; });
                    btn.addEventListener('touchend', (e) => { e.preventDefault(); move[k] = false; });
                }
            });
        }

        function shoot() {
            if (myAmmo > 0 && gameState === 'game') {
                myAmmo--;
                document.getElementById('ammo-ui').innerText = `⚡ Munition: ${myAmmo} / 30`;
                triggerShootEffect();
                if (conn && conn.open) conn.send({ type: 'shot' });

                if (otherPlayer) {
                    const dist = myPlayer.position.distanceTo(otherPlayer.position);
                    if (dist < 10) {
                        if (conn && conn.open) conn.send({ type: 'hit' });
                    }
                }
            }
        }

        function triggerShootEffect() {
            renderer.domElement.style.filter = "brightness(1.8)";
            setTimeout(() => renderer.domElement.style.filter = "none", 60);
        }

        function startBattle() {
            gameState = 'game';
            uiLayer.style.display = 'none';
            gameHud.style.display = 'block';
            
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('touch-controls').style.display = 'block';
                document.getElementById('shoot-btn').style.display = 'flex';
                document.getElementById('controls-hint').style.display = 'none';
            }

            scene.remove(myPlayer);
            scene.remove(otherPlayer);
            myPlayer = createMinecraftCharacter(myData.color, true);
            otherPlayer = createMinecraftCharacter(peerData.color, true);

            myPlayer.position.set(isHost ? -20 : 20, 0, 0);
            otherPlayer.position.set(isHost ? 20 : -20, 0, 0);
            scene.add(myPlayer);
            scene.add(otherPlayer);
        }

        function checkCollision(x, z) {
            for (let obs of obstacles) {
                if (x > obs.x - obs.width/2 - 0.6 && x < obs.x + obs.width/2 + 0.6 &&
                    z > obs.z - obs.depth/2 - 0.6 && z < obs.z + obs.depth/2 + 0.6) {
                    return true;
                }
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (gameState === 'menu' || gameState === 'lobby') {
                camera.position.set(0, 2.5, 6);
                camera.lookAt(0, 1.2, 0);
                if(myPlayer) myPlayer.position.y = Math.sin(elapsedTime * 2) * 0.04;
                if(otherPlayer) otherPlayer.position.y = Math.sin(elapsedTime * 2 + 1) * 0.04;

            } else if (gameState === 'game') {
                let isMoving = false;
                let dirX = 0, dirZ = 0;

                myPlayer.position.y = 0; 
                if(otherPlayer) otherPlayer.position.y = 0;

                if (move.w) { dirZ -= 1; isMoving = true; }
                if (move.s) { dirZ += 1; isMoving = true; }
                if (move.a) { dirX -= 1; isMoving = true; }
                if (move.d) { dirX += 1; isMoving = true; }

                if (isMoving) {
                    let nextX = myPlayer.position.x + dirX * 0.15;
                    let nextZ = myPlayer.position.z + dirZ * 0.15;

                    if (!checkCollision(nextX, nextZ)) {
                        myPlayer.position.x = nextX;
                        myPlayer.position.z = nextZ;
                    }
                    myPlayer.rotation.y = Math.atan2(dirX, dirZ);
                }

                animateLimbs(myPlayer, isMoving, elapsedTime);

                // Kamera folgt dem Spieler
                camera.position.x = myPlayer.position.x;
                camera.position.z = myPlayer.position.z + 7;
                camera.position.y = myPlayer.position.y + 4.5;
                camera.lookAt(myPlayer.position.x, myPlayer.position.y + 1.5, myPlayer.position.z);

                if (conn && conn.open) {
                    conn.send({ type: 'pos', x: myPlayer.position.x, z: myPlayer.position.z, rot: myPlayer.rotation.y, isMoving: isMoving, time: elapsedTime });
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
