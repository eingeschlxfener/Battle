<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Serverless Battle Royale - Minecraft Edition</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #87CEEB; }
        #ui-layer { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); color: white; z-index: 20; }
        input, select, button { padding: 12px; margin: 5px; font-size: 16px; border-radius: 5px; border: none; }
        input[type="color"] { padding: 0; width: 50px; height: 45px; cursor: pointer; vertical-align: middle; }
        button { background: #4488ff; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #3366cc; }
        #game-ui { position: absolute; top: 10px; left: 10px; color: white; font-weight: bold; display: none; z-index: 10; text-shadow: 1px 1px 2px black; font-size: 20px; }
        .lobby-box { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; text-align: center; max-width: 400px; width: 90%; }
        #player-list { list-style: none; padding: 0; font-size: 18px; margin: 20px 0; }
        #player-list li { padding: 10px; background: rgba(0,0,0,0.5); margin-bottom: 5px; border-radius: 5px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .color-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid white; display: inline-block; }
    </style>
</head>
<body>
    <div id="game-ui"></div>
    
    <div id="ui-layer">
        <h1>Browser Royale 3D</h1>
        
        <!-- Hauptmenü -->
        <div id="menu" class="lobby-box">
            <h3>Dein Minecraft Charakter</h3>
            <input type="text" id="player-name" placeholder="Dein Name" maxlength="15" style="width: calc(100% - 24px);">
            
            <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px;">
                <label>Shirt-Farbe:</label>
                <input type="color" id="player-color" value="#00aaee" title="Wähle Shirt-Farbe">
            </div>
            
            <br>
            <hr style="border-color: #555;">
            <br>
            <button onclick="hostGame()" style="width: 100%;">Lobby erstellen (Host)</button>
            <br><br>
            <p>Oder per Link/ID beitreten:</p>
            <input type="text" id="join-id" placeholder="Game-ID oder Link" style="width: calc(100% - 24px);">
            <button onclick="joinGame()" style="width: 100%; background: #ff8800;">Beitreten</button>
            <p id="menu-status" style="color: #ffaaaa;"></p>
        </div>

        <!-- Lobby Übersicht -->
        <div id="lobby" class="lobby-box" style="display: none;">
            <h2>Lobby</h2>
            
            <div id="host-controls" style="display: none;">
                <p>Dein Einladungs-Link:</p>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <input type="text" id="display-id" readonly style="text-align: center; background: #ddd; color: black; width: 100%; box-sizing: border-box;">
                    <button onclick="copyInviteCode()" style="background: #ffaa00;">Link kopieren</button>
                </div>
            </div>

            <ul id="player-list"></ul>

            <p id="lobby-status">Warte auf Verbindung...</p>
            <button id="start-btn" onclick="sendStartGame()" style="display: none; background: #55aa55; width: 100%; font-size: 20px;">Spiel starten</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <script>
        let peer, conn, isHost = false;
        
        let myData = { name: "Steve", color: "#00aaee" };
        let peerData = { name: "Wartet...", color: "#ff4444" };

        const uiLayer = document.getElementById('ui-layer');
        const menuDiv = document.getElementById('menu');
        const lobbyDiv = document.getElementById('lobby');
        const playerList = document.getElementById('player-list');
        const lobbyStatus = document.getElementById('lobby-status');
        const startBtn = document.getElementById('start-btn');
        const displayId = document.getElementById('display-id');
        const gameUi = document.getElementById('game-ui');

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const joinId = urlParams.get('join');
            if (joinId) {
                document.getElementById('join-id').value = joinId;
            }
        };

        function getMyProfile() {
            const nameInput = document.getElementById('player-name').value.trim();
            if (nameInput) myData.name = nameInput;
            myData.color = document.getElementById('player-color').value;
        }

        function updateLobbyUI() {
            let html = `<li><span class="color-dot" style="background: ${myData.color};"></span> ${myData.name} (Du)</li>`;
            if (conn && conn.open) {
                html += `<li><span class="color-dot" style="background: ${peerData.color};"></span> ${peerData.name}</li>`;
            }
            playerList.innerHTML = html;
        }

        function copyInviteCode() {
            displayId.select();
            document.execCommand("copy"); 
            if (navigator.clipboard) {
                navigator.clipboard.writeText(displayId.value);
            }
            alert("Link kopiert! Schicke ihn an deinen Freund.");
        }

        function hostGame() {
            getMyProfile();
            document.getElementById('menu-status').innerText = "Erstelle Lobby...";
            isHost = true;
            peer = new Peer(); 
            
            peer.on('open', (id) => {
                menuDiv.style.display = 'none';
                lobbyDiv.style.display = 'block';
                document.getElementById('host-controls').style.display = 'block';
                
                const fullLink = window.location.origin + window.location.pathname + '?join=' + id;
                displayId.value = fullLink;
                
                updateLobbyUI();
                lobbyStatus.innerText = "Warte auf Mitspieler...";
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });
        }

        function joinGame() {
            let hostId = document.getElementById('join-id').value.trim();
            if (!hostId) {
                document.getElementById('menu-status').innerText = "Bitte einen Link oder eine ID eingeben!";
                return;
            }
            
            if (hostId.includes('?join=')) {
                hostId = hostId.split('?join=')[1];
            }

            getMyProfile();
            document.getElementById('menu-status').innerText = "Verbinde zur Lobby...";
            isHost = false;
            peer = new Peer();
            
            peer.on('open', () => {
                conn = peer.connect(hostId);
                setupConnection();
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                conn.send({ type: 'profile', profile: myData });
                
                if (!isHost) {
                    menuDiv.style.display = 'none';
                    lobbyDiv.style.display = 'block';
                    lobbyStatus.innerText = "Verbunden! Warte auf Start durch Host...";
                    updateLobbyUI();
                }
            });

            conn.on('data', (data) => {
                if (data.type === 'profile') {
                    peerData = data.profile;
                    updateLobbyUI();
                    
                    if (isHost) {
                        lobbyStatus.innerText = "Alle bereit!";
                        startBtn.style.display = 'block';
                        conn.send({ type: 'profile', profile: myData });
                    }
                } else if (data.type === 'start') {
                    init3DGame();
                } else if (data.type === 'pos' && otherPlayer) {
                    otherPlayer.position.x = data.x;
                    otherPlayer.position.z = data.z;
                    otherPlayer.rotation.y = data.rot;
                    animateLimbs(otherPlayer, data.isMoving, data.time);
                }
            });
        }

        function sendStartGame() {
            conn.send({ type: 'start' });
            init3DGame();
        }

        // --- MINECRAFT CHARAKTER ERSTELLUNG ---
        function createMinecraftCharacter(shirtColorHex) {
            const group = new THREE.Group();

            const matSkin = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
            const matShirt = new THREE.MeshLambertMaterial({ color: shirtColorHex });
            const matPants = new THREE.MeshLambertMaterial({ color: 0x223366 });
            const matEyes = new THREE.MeshLambertMaterial({ color: 0x000000 });

            // Kopf
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), matSkin);
            head.position.y = 2.2;
            group.add(head);

            // Augen
            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.05), matEyes);
            eyeL.position.set(-0.2, 2.25, 0.41);
            group.add(eyeL);
            const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.05), matEyes);
            eyeR.position.set(0.2, 2.25, 0.41);
            group.add(eyeR);

            // Torso (Oberkörper)
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.4), matShirt);
            torso.position.y = 1.3;
            group.add(torso);

            // Arme (mit Pivot-Punkt an den Schultern)
            const armGeo = new THREE.BoxGeometry(0.3, 1.0, 0.3);
            armGeo.translate(0, -0.4, 0);

            const leftArm = new THREE.Mesh(armGeo, matSkin);
            leftArm.position.set(-0.58, 1.7, 0);
            group.add(leftArm);

            const rightArm = new THREE.Mesh(armGeo, matSkin);
            rightArm.position.set(0.58, 1.7, 0);
            group.add(rightArm);

            // Beine (mit Pivot-Punkt an der Hüfte)
            const legGeo = new THREE.BoxGeometry(0.35, 1.0, 0.35);
            legGeo.translate(0, -0.4, 0);

            const leftLeg = new THREE.Mesh(legGeo, matPants);
            leftLeg.position.set(-0.2, 0.8, 0);
            group.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeo, matPants);
            rightLeg.position.set(0.2, 0.8, 0);
            group.add(rightLeg);

            // Referenzen für Lauf-Animationen speichern
            group.userData = { leftArm, rightArm, leftLeg, rightLeg };

            return group;
        }

        function animateLimbs(characterGroup, isMoving, time) {
            const { leftArm, rightArm, leftLeg, rightLeg } = characterGroup.userData;
            if (!leftArm) return;

            if (isMoving) {
                const angle = Math.sin(time * 10) * 0.6;
                leftArm.rotation.x = angle;
                rightArm.rotation.x = -angle;
                leftLeg.rotation.x = -angle;
                rightLeg.rotation.x = angle;
            } else {
                leftArm.rotation.x = 0;
                rightArm.rotation.x = 0;
                leftLeg.rotation.x = 0;
                rightLeg.rotation.x = 0;
            }
        }

        // --- 3D SPIEL LOGIK ---
        let scene, camera, renderer, myPlayer, otherPlayer;
        const move = { w: false, a: false, s: false, d: false };

        function init3DGame() {
            uiLayer.style.display = 'none';
            gameUi.style.display = 'block';
            gameUi.innerText = `${myData.name} vs ${peerData.name}`;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Beleuchtung
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(5, 10, 7.5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x606060));

            // Boden (Grüne Minecraft-Wiese)
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshLambertMaterial({ color: 0x55aa55 }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Minecraft Charaktere erstellen
            myPlayer = createMinecraftCharacter(myData.color);
            otherPlayer = createMinecraftCharacter(peerData.color);

            myPlayer.position.x = isHost ? -3 : 3;
            otherPlayer.position.x = isHost ? 3 : -3;

            scene.add(myPlayer);
            scene.add(otherPlayer);

            document.addEventListener('keydown', e => {
                if(move.hasOwnProperty(e.key.toLowerCase())) move[e.key.toLowerCase()] = true;
            });
            document.addEventListener('keyup', e => {
                if(move.hasOwnProperty(e.key.toLowerCase())) move[e.key.toLowerCase()] = false;
            });

            animate();
        }

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();
            let isMoving = false;
            let dirX = 0, dirZ = 0;

            if (move.w) { dirZ -= 1; isMoving = true; }
            if (move.s) { dirZ += 1; isMoving = true; }
            if (move.a) { dirX -= 1; isMoving = true; }
            if (move.d) { dirX += 1; isMoving = true; }

            if (isMoving) {
                myPlayer.position.x += dirX * 0.1;
                myPlayer.position.z += dirZ * 0.1;

                // Figur in Bewegungsrichtung drehen
                const targetRotation = Math.atan2(dirX, dirZ);
                myPlayer.rotation.y = targetRotation;
            }

            // Lauf-Animation ausführen
            animateLimbs(myPlayer, isMoving, elapsedTime);

            // Kamera sanft hinter dem Spieler führen
            camera.position.x = myPlayer.position.x;
            camera.position.z = myPlayer.position.z + 6;
            camera.position.y = myPlayer.position.y + 4;
            camera.lookAt(myPlayer.position.x, myPlayer.position.y + 1.5, myPlayer.position.z);

            // Position & Rotation an Freund senden
            if (conn && conn.open) {
                conn.send({
                    type: 'pos',
                    x: myPlayer.position.x,
                    z: myPlayer.position.z,
                    rot: myPlayer.rotation.y,
                    isMoving: isMoving,
                    time: elapsedTime
                });
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
