<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Serverless Battle Royale - Full Game</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #87CEEB; user-select: none; }
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        /* UI-Ebene */
        #ui-layer { position: absolute; width: 100%; height: 100%; display: flex; justify-content: flex-start; align-items: center; padding-left: 50px; z-index: 20; pointer-events: none; box-sizing: border-box; }
        .lobby-box { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); padding: 20px; border-radius: 12px; text-align: center; max-width: 340px; width: 100%; pointer-events: auto; border: 1px solid rgba(255,255,255,0.2); box-shadow: 0px 15px 35px rgba(0,0,0,0.6); color: white; }
        
        input, select, button { padding: 10px; margin: 6px 0; font-size: 15px; border-radius: 6px; border: none; width: 100%; box-sizing: border-box; }
        input[type="color"] { padding: 0; height: 40px; cursor: pointer; }
        button { background: #4488ff; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #3366cc; }

        /* Spiel-HUD (während des Matches) */
        #game-hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 10; pointer-events: none; box-sizing: border-box; padding: 20px; }
        .hud-element { position: absolute; background: rgba(0,0,0,0.6); color: white; padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 18px; text-shadow: 1px 1px 2px black; }
        #hp-ui { top: 20px; right: 20px; color: #ff4444; }
        #ammo-ui { bottom: 20px; right: 20px; color: #ffaa00; }
        #controls-hint { top: 20px; left: 20px; font-size: 14px; background: rgba(0,0,0,0.7); border-left: 4px solid #4488ff; }
        
        /* Touch Controls für Handy/Tablet */
        #touch-controls { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px; display: none; pointer-events: auto; }
        .touch-btn { position: absolute; width: 45px; height: 45px; background: rgba(255,255,255,0.3); border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 20px; }
        #btn-w { top: 0; left: 52px; }
        #btn-s { bottom: 0; left: 52px; }
        #btn-a { top: 52px; left: 0; }
        #btn-d { top: 52px; right: 0; }
        #shoot-btn { position: absolute; bottom: 30px; right: 30px; width: 80px; height: 80px; background: rgba(255,68,68,0.7); border: 3px solid white; border-radius: 50%; color: white; font-weight: bold; font-size: 16px; display: none; pointer-events: auto; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

        #player-list { list-style: none; padding: 0; font-size: 16px; margin: 10px 0; text-align: left; }
        #player-list li { padding: 8px; background: rgba(255,255,255,0.15); margin-bottom: 5px; border-radius: 5px; display: flex; align-items: center; gap: 10px; }
        .color-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; display: inline-block; flex-shrink: 0; }
        h1, h3 { margin-top: 0; }
    </style>
</head>
<body>
    <!-- In-Game HUD -->
    <div id="game-hud">
        <div id="controls-hint" class="hud-element">
            🎮 <b>Hinweis für PC-Spieler:</b><br>
            Bewegen mit <b>W, A, S, D</b><br>
            Zielen mit der <b>Maus</b><br>
            Schießen mit <b>Leertaste</b> oder Klick
        </div>
        <div id="hp-ui" class="hud-element">❤️ Leben: 100</div>
        <div id="ammo-ui" class="hud-element">ammo Munition: 30 / 30</div>
        
        <!-- Touch Steuerkreuze für Mobile -->
        <div id="touch-controls">
            <div id="btn-w" class="touch-btn">W</div>
            <div id="btn-a" class="touch-btn">A</div>
            <div id="btn-s" class="touch-btn">S</div>
            <div id="btn-d" class="touch-btn">D</div>
        </div>
        <div id="shoot-btn" onclick="shoot()">FEUER</div>
    </div>
    
    <div id="ui-layer">
        <!-- Hauptmenü -->
        <div id="menu" class="lobby-box">
            <h3>Dein Charakter</h3>
            <input type="text" id="player-name" placeholder="Dein Name" maxlength="15" value="Steve">
            
            <div style="display: flex; align-items: center; gap: 10px; margin: 5px 0;">
                <label style="font-size: 14px;">Shirt-Farbe:</label>
                <input type="color" id="player-color" value="#00aaee">
            </div>
            
            <hr style="border-color: rgba(255,255,255,0.2); margin: 15px 0;">
            
            <button onclick="hostGame()">Lobby erstellen (Host)</button>
            <p style="margin: 10px 0 5px 0; font-size: 13px; color: #ccc;">Oder Einladungs-Link einfügen:</p>
            <input type="text" id="join-id" placeholder="Game-ID oder Link">
            <button onclick="joinGame()" style="background: #ff8800;">Beitreten</button>
            <p id="menu-status" style="color: #ffaaaa; margin: 8px 0 0 0; font-size: 14px;"></p>
        </div>

        <!-- Lobby Übersicht -->
        <div id="lobby" class="lobby-box" style="display: none;">
            <h3>Lobby</h3>
            <div id="host-controls" style="display: none;">
                <p style="font-size: 13px; margin-bottom: 5px; text-align: left;">Einladungs-Link:</p>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="display-id" readonly style="background: #222; color: #00ff00; font-size: 12px; text-align: center;">
                    <button onclick="copyInviteCode()" style="background: #ffaa00; width: auto; padding: 0 12px;">Kopieren</button>
                </div>
            </div>
            <ul id="player-list"></ul>
            <p id="lobby-status" style="font-size: 14px; font-weight: bold; margin: 15px 0;">Warte auf Verbindung...</p>
            <button id="start-btn" onclick="sendStartGame()" style="display: none; background: #55aa55; font-size: 18px;">Spiel starten</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <script>
        let peer, conn, isHost = false;
        let gameState = 'menu';
        
        let myData = { name: "Steve", color: "#00aaee" };
        let peerData = { name: "Wartet...", color: "#ff4444" };
        
        let myHp = 100;
        let myAmmo = 30;

        const uiLayer = document.getElementById('ui-layer');
        const menuDiv = document.getElementById('menu');
        const lobbyDiv = document.getElementById('lobby');
        const playerList = document.getElementById('player-list');
        const lobbyStatus = document.getElementById('lobby-status');
        const startBtn = document.getElementById('start-btn');
        const displayId = document.getElementById('display-id');
        const gameHud = document.getElementById('game-hud');

        window.onload = () => {
            init3DEnvironment();
            const urlParams = new URLSearchParams(window.location.search);
            const joinId = urlParams.get('join');
            if (joinId) document.getElementById('join-id').value = joinId;
        };

        document.getElementById('player-color').addEventListener('input', (e) => {
            myData.color = e.target.value;
            if (myPlayer) updateShirtColor(myPlayer, myData.color);
            if (conn && conn.open) conn.send({ type: 'profile', profile: myData });
        });

        document.getElementById('player-name').addEventListener('input', (e) => {
            myData.name = e.target.value || "Steve";
            if (conn && conn.open) conn.send({ type: 'profile', profile: myData });
        });

        function updateLobbyUI() {
            let html = `<li><span class="color-dot" style="background: ${myData.color};"></span> ${myData.name} (Du)</li>`;
            if (conn && conn.open) {
                html += `<li><span class="color-dot" style="background: ${peerData.color};"></span> ${peerData.name}</li>`;
            }
            playerList.innerHTML = html;
        }

        function copyInviteCode() {
            displayId.select();
            if (navigator.clipboard) navigator.clipboard.writeText(displayId.value);
            alert("Link kopiert!");
        }

        function hostGame() {
            document.getElementById('menu-status').innerText = "Erstelle Lobby...";
            isHost = true;
            gameState = 'lobby';
            if (myPlayer) { myPlayer.position.set(-1, 0, 0); myPlayer.rotation.y = 0.4; }

            peer = new Peer(); 
            peer.on('open', (id) => {
                menuDiv.style.display = 'none';
                lobbyDiv.style.display = 'block';
                document.getElementById('host-controls').style.display = 'block';
                displayId.value = window.location.origin + window.location.pathname + '?join=' + id;
                updateLobbyUI();
                lobbyStatus.innerText = "Warte auf Mitspieler...";
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });
        }

        function joinGame() {
            let hostId = document.getElementById('join-id').value.trim();
            if (!hostId) return document.getElementById('menu-status').innerText = "Bitte ID eingeben!";
            if (hostId.includes('?join=')) hostId = hostId.split('?join=')[1];

            document.getElementById('menu-status').innerText = "Verbinde...";
            isHost = false;
            gameState = 'lobby';
            if (myPlayer) { myPlayer.position.set(1, 0, 0); myPlayer.rotation.y = -0.4; }

            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(hostId);
                setupConnection();
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                conn.send({ type: 'profile', profile: myData });
                if (!isHost) {
                    menuDiv.style.display = 'none';
                    lobbyDiv.style.display = 'block';
                    lobbyStatus.innerText = "Verbunden! Warte auf Start...";
                    updateLobbyUI();
                }
            });

            conn.on('data', (data) => {
                if (data.type === 'profile') {
                    peerData = data.profile;
                    updateLobbyUI();
                    if (!otherPlayer) {
                        otherPlayer = createMinecraftCharacter(peerData.color, true);
                        otherPlayer.position.set(isHost ? 1 : -1, 0, 0);
                        otherPlayer.rotation.y = isHost ? -0.4 : 0.4;
                        scene.add(otherPlayer);
                    } else {
                        updateShirtColor(otherPlayer, peerData.color);
                    }
                    if (isHost) {
                        lobbyStatus.innerText = "Alle bereit!";
                        startBtn.style.display = 'block';
                        conn.send({ type: 'profile', profile: myData });
                    }
                } else if (data.type === 'start') {
                    startBattle();
                } else if (data.type === 'pos' && otherPlayer && gameState === 'game') {
                    otherPlayer.position.x = data.x;
                    otherPlayer.position.z = data.z;
                    otherPlayer.rotation.y = data.rot;
                    animateLimbs(otherPlayer, data.isMoving, data.time);
                } else if (data.type === 'shot') {
                    triggerShootEffect();
                } else if (data.type === 'hit') {
                    myHp = Math.max(0, myHp - 10);
                    document.getElementById('hp-ui').innerText = `❤️ Leben: ${myHp}`;
                    if(myHp <= 0) alert("Du wurdest besiegt!");
                }
            });
        }

        function sendStartGame() {
            conn.send({ type: 'start' });
            startBattle();
        }

        // --- 3D ENGINE & MAP GENERIERUNG ---
        let scene, camera, renderer, myPlayer, otherPlayer;
        let clock = new THREE.Clock();
        const move = { w: false, a: false, s: false, d: false };
        const obstacles = []; // Für Haus-Wände Kollisionsabfrage

        function init3DEnvironment() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Licht
            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(10, 20, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x707070));

            // Boden (Battle Royale Arena Wiese)
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshLambertMaterial({ color: 0x55aa55 }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Häuser & Wände generieren (Hindernisse)
            createBuilding(-10, -10, 6, 4, 0x884422);
            createBuilding(12, 10, 5, 8, 0x666666);
            createBuilding(-12, 12, 6, 6, 0xaa4444);

            // Eigenen Charakter im Menü anzeigen
            myPlayer = createMinecraftCharacter(myData.color, true);
            myPlayer.position.set(2, 0, -1);
            myPlayer.rotation.y = -0.5;
            scene.add(myPlayer);

            // Steuerung (PC & Touch)
            setupControls();
            animate();
        }

        function createBuilding(x, z, width, depth, colorHex) {
            const height = 4;
            const geo = new THREE.BoxGeometry(width, height, depth);
            const mat = new THREE.MeshLambertMaterial({ color: colorHex });
            const building = new THREE.Mesh(geo, mat);
            building.position.set(x, height / 2, z);
            scene.add(building);
            obstacles.push({ x, z, width, depth });
        }

        function createMinecraftCharacter(shirtColorHex, hasWeapon = false) {
            const group = new THREE.Group();
            const matSkin = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
            const matShirt = new THREE.MeshLambertMaterial({ color: shirtColorHex });
            const matPants = new THREE.MeshLambertMaterial({ color: 0x223366 });
            const matEyes = new THREE.MeshLambertMaterial({ color: 0x000000 });

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), matSkin);
            head.position.y = 2.2; group.add(head);

            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.05), matEyes);
            eyeL.position.set(-0.2, 2.25, 0.41); group.add(eyeL);
            const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.05), matEyes);
            eyeR.position.set(0.2, 2.25, 0.41); group.add(eyeR);

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.4), matShirt);
            torso.position.y = 1.3; torso.name = "shirt"; group.add(torso);

            const armGeo = new THREE.BoxGeometry(0.3, 1.0, 0.3); armGeo.translate(0, -0.4, 0);
            const leftArm = new THREE.Mesh(armGeo, matSkin); leftArm.position.set(-0.58, 1.7, 0); group.add(leftArm);
            const rightArm = new THREE.Mesh(armGeo, matSkin); rightArm.position.set(0.58, 1.7, 0); group.add(rightArm);

            const legGeo = new THREE.BoxGeometry(0.35, 1.0, 0.35); legGeo.translate(0, -0.4, 0);
            const leftLeg = new THREE.Mesh(legGeo, matPants); leftLeg.position.set(-0.2, 0.8, 0); group.add(leftLeg);
            const rightLeg = new THREE.Mesh(legGeo, matPants); rightLeg.position.set(0.2, 0.8, 0); group.add(rightLeg);

            // Waffe in die Hand geben (Blaster)
            if (hasWeapon) {
                const weaponGeo = new THREE.BoxGeometry(0.2, 0.2, 0.8);
                const weaponMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
                const weapon = new THREE.Mesh(weaponGeo, weaponMat);
                weapon.position.set(0.7, 1.2, 0.4);
                group.add(weapon);
            }

            group.userData = { leftArm, rightArm, leftLeg, rightLeg };
            return group;
        }

        function updateShirtColor(playerGroup, hexColor) {
            playerGroup.children.forEach(child => {
                if (child.name === "shirt") child.material.color.set(hexColor);
            });
        }

        function animateLimbs(characterGroup, isMoving, time) {
            const { leftArm, rightArm, leftLeg, rightLeg } = characterGroup.userData;
            if (!leftArm) return;
            if (isMoving) {
                const angle = Math.sin(time * 10) * 0.6;
                leftArm.rotation.x = angle; rightArm.rotation.x = -angle;
                leftLeg.rotation.x = -angle; rightLeg.rotation.x = angle;
            } else {
                leftArm.rotation.x = 0; rightArm.rotation.x = 0;
                leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
            }
        }

        function setupControls() {
            document.addEventListener('keydown', e => { 
                if(move.hasOwnProperty(e.key.toLowerCase())) move[e.key.toLowerCase()] = true; 
                if(e.code === 'Space' && gameState === 'game') shoot();
            });
            document.addEventListener('keyup', e => { 
                if(move.hasOwnProperty(e.key.toLowerCase())) move[e.key.toLowerCase()] = false; 
            });

            // Klick zum Schießen
            window.addEventListener('click', () => {
                if (gameState === 'game') shoot();
            });

            // Touch-Buttons für Mobile
            ['w', 'a', 's', 'd'].forEach(k => {
                const btn = document.getElementById(`btn-${k}`);
                if(btn) {
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); move[k] = true; });
                    btn.addEventListener('touchend', (e) => { e.preventDefault(); move[k] = false; });
                }
            });
        }

        function shoot() {
            if (myAmmo > 0 && gameState === 'game') {
                myAmmo--;
                document.getElementById('ammo-ui').innerText = `ammo Munition: ${myAmmo} / 30`;
                triggerShootEffect();
                if (conn && conn.open) conn.send({ type: 'shot' });

                // Trefferprüfung beim Gegner
                if (otherPlayer) {
                    const dist = myPlayer.position.distanceTo(otherPlayer.position);
                    if (dist < 8) { // Trefferreichweite
                        if (conn && conn.open) conn.send({ type: 'hit' });
                    }
                }
            }
        }

        function triggerShootEffect() {
            // Kurzer Mündungsblitz Effekt
            renderer.domElement.style.filter = "brightness(1.5)";
            setTimeout(() => renderer.domElement.style.filter = "none", 50);
        }

        function startBattle() {
            gameState = 'game';
            uiLayer.style.display = 'none';
            gameHud.style.display = 'block';
            
            // Touch Controls auf Mobilgeräten anzeigen
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('touch-controls').style.display = 'block';
                document.getElementById('shoot-btn').style.display = 'flex';
                document.getElementById('controls-hint').style.display = 'none'; // Auf Handy wird PC Hinweis ausgeblendet
            }

            // Waffen an Figuren ausrüsten
            scene.remove(myPlayer);
            scene.remove(otherPlayer);
            myPlayer = createMinecraftCharacter(myData.color, true);
            otherPlayer = createMinecraftCharacter(peerData.color, true);

            myPlayer.position.set(isHost ? -15 : 15, 0, 0);
            otherPlayer.position.set(isHost ? 15 : -15, 0, 0);
            scene.add(myPlayer);
            scene.add(otherPlayer);
        }

        // Kollisionsabfrage mit Häusern
        function checkCollision(x, z) {
            for (let obs of obstacles) {
                if (x > obs.x - obs.width/2 - 0.5 && x < obs.x + obs.width/2 + 0.5 &&
                    z > obs.z - obs.depth/2 - 0.5 && z < obs.z + obs.depth/2 + 0.5) {
                    return true;
                }
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (gameState === 'menu' || gameState === 'lobby') {
                camera.position.set(0, 2.5, 6);
                camera.lookAt(0, 1.2, 0);
                if(myPlayer) myPlayer.position.y = Math.sin(elapsedTime * 2) * 0.04;
                if(otherPlayer) otherPlayer.position.y = Math.sin(elapsedTime * 2 + 1) * 0.04;

            } else if (gameState === 'game') {
                let isMoving = false;
                let dirX = 0, dirZ = 0;

                myPlayer.position.y = 0; 
                if(otherPlayer) otherPlayer.position.y = 0;

                if (move.w) { dirZ -= 1; isMoving = true; }
                if (move.s) { dirZ += 1; isMoving = true; }
                if (move.a) { dirX -= 1; isMoving = true; }
                if (move.d) { dirX += 1; isMoving = true; }

                if (isMoving) {
                    let nextX = myPlayer.position.x + dirX * 0.15;
                    let nextZ = myPlayer.position.z + dirZ * 0.15;

                    // Nur bewegen, wenn kein Haus im Weg ist
                    if (!checkCollision(nextX, nextZ)) {
                        myPlayer.position.x = nextX;
                        myPlayer.position.z = nextZ;
                    }
                    myPlayer.rotation.y = Math.atan2(dirX, dirZ);
                }

                animateLimbs(myPlayer, isMoving, elapsedTime);

                // Kamera folgt dem Spieler im Stil eines klassischen Third-Person Shooters
                camera.position.x = myPlayer.position.x;
                camera.position.z = myPlayer.position.z + 6;
                camera.position.y = myPlayer.position.y + 4;
                camera.lookAt(myPlayer.position.x, myPlayer.position.y + 1.5, myPlayer.position.z);

                if (conn && conn.open) {
                    conn.send({ type: 'pos', x: myPlayer.position.x, z: myPlayer.position.z, rot: myPlayer.rotation.y, isMoving: isMoving, time: elapsedTime });
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
