<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Serverless Battle Royale</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #87CEEB; }
        #ui-layer { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); color: white; z-index: 20; }
        input, button { padding: 12px; margin: 5px; font-size: 16px; border-radius: 5px; border: none; }
        button { background: #4488ff; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #3366cc; }
        #game-ui { position: absolute; top: 10px; left: 10px; color: white; font-weight: bold; display: none; z-index: 10; text-shadow: 1px 1px 2px black; }
        .lobby-box { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; text-align: center; }
        #player-list { list-style: none; padding: 0; font-size: 18px; margin: 20px 0; }
        #player-list li { padding: 5px; background: rgba(0,0,0,0.5); margin-bottom: 5px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="game-ui">HP: 100 | Serverless Mode</div>
    
    <div id="ui-layer">
        <h1>Browser Royale</h1>
        
        <!-- Hauptmenü -->
        <div id="menu" class="lobby-box">
            <button onclick="hostGame()">Lobby erstellen (Host)</button>
            <br><br>
            <p>Oder einem Freund beitreten:</p>
            <input type="text" id="join-id" placeholder="Game-ID einfügen">
            <button onclick="joinGame()">Beitreten</button>
            <p id="menu-status"></p>
        </div>

        <!-- Lobby Übersicht (versteckt bis erstellt/beigetreten) -->
        <div id="lobby" class="lobby-box" style="display: none;">
            <h2>Lobby</h2>
            
            <div id="host-controls" style="display: none;">
                <p>Deine Game-ID (schicke sie deinem Freund):</p>
                <div style="display: flex; gap: 5px; justify-content: center;">
                    <input type="text" id="display-id" readonly style="width: 200px; text-align: center; background: #ddd; color: black;">
                    <button onclick="copyInviteCode()" style="background: #ffaa00;">Kopieren</button>
                </div>
            </div>

            <ul id="player-list">
                <!-- Spieler werden hier aufgelistet -->
            </ul>

            <p id="lobby-status">Warte auf Verbindung...</p>
            <button id="start-btn" onclick="sendStartGame()" style="display: none; background: #55aa55; width: 100%; font-size: 20px;">Spiel starten</button>
        </div>
    </div>

    <!-- Bibliotheken -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <script>
        let peer, conn, isHost = false;
        
        // UI Elemente
        const uiLayer = document.getElementById('ui-layer');
        const menuDiv = document.getElementById('menu');
        const lobbyDiv = document.getElementById('lobby');
        const playerList = document.getElementById('player-list');
        const lobbyStatus = document.getElementById('lobby-status');
        const startBtn = document.getElementById('start-btn');
        const displayId = document.getElementById('display-id');

        // --- LOBBY LOGIK ---

        function copyInviteCode() {
            displayId.select();
            document.execCommand("copy"); // Fallback für iPads
            navigator.clipboard.writeText(displayId.value).then(() => {
                alert("Code kopiert! Du kannst ihn jetzt einfügen.");
            }).catch(() => {
                alert("Bitte Code manuell markieren und kopieren.");
            });
        }

        function hostGame() {
            document.getElementById('menu-status').innerText = "Erstelle Lobby...";
            isHost = true;
            peer = new Peer(); 
            
            peer.on('open', (id) => {
                menuDiv.style.display = 'none';
                lobbyDiv.style.display = 'block';
                document.getElementById('host-controls').style.display = 'block';
                displayId.value = id;
                
                playerList.innerHTML = '<li>👑 Host (Du)</li>';
                lobbyStatus.innerText = "Warte auf Spieler 2...";
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                
                // Lobby aktualisieren
                playerList.innerHTML += '<li>🎮 Spieler 2</li>';
                lobbyStatus.innerText = "Alle bereit!";
                startBtn.style.display = 'block'; // Host kann jetzt starten
            });
        }

        function joinGame() {
            const hostId = document.getElementById('join-id').value.trim();
            if (!hostId) return alert("Bitte eine ID eingeben!");
            
            document.getElementById('menu-status').innerText = "Verbinde zur Lobby...";
            isHost = false;
            peer = new Peer();
            
            peer.on('open', () => {
                conn = peer.connect(hostId);
                conn.on('open', () => {
                    setupConnection();
                    
                    // Lobby anzeigen (ohne Start-Button und Code)
                    menuDiv.style.display = 'none';
                    lobbyDiv.style.display = 'block';
                    playerList.innerHTML = '<li>👑 Host</li><li>🎮 Spieler 2 (Du)</li>';
                    lobbyStatus.innerText = "Warte darauf, dass der Host das Spiel startet...";
                });
            });
        }

        function setupConnection() {
            // Daten vom anderen Spieler empfangen
            conn.on('data', (data) => {
                if (data.type === 'start') {
                    init3DGame(); // Spiel startet für Client
                } else if (data.type === 'pos' && otherPlayer) {
                    otherPlayer.position.x = data.x;
                    otherPlayer.position.z = data.z;
                }
            });
        }

        function sendStartGame() {
            conn.send({ type: 'start' }); // Sagt dem Client, dass es losgeht
            init3DGame(); // Startet für Host
        }

        // --- 3D SPIEL LOGIK (Three.js) ---
        let scene, camera, renderer, myPlayer, otherPlayer;
        const move = { w: false, a: false, s: false, d: false };

        function init3DGame() {
            uiLayer.style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshBasicMaterial({ color: 0x55aa55 }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const geo = new THREE.BoxGeometry(1, 2, 1);
            myPlayer = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: isHost ? 0x3333aa : 0xaa3333 }));
            otherPlayer = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: isHost ? 0xaa3333 : 0x3333aa }));
            
            myPlayer.position.x = isHost ? -2 : 2;
            otherPlayer.position.x = isHost ? 2 : -2;

            scene.add(myPlayer);
            scene.add(otherPlayer);

            // Steuerung (für iPad später noch Touch-Buttons nötig, dies ist für Tastatur)
            document.addEventListener('keydown', e => move[e.key.toLowerCase()] = true);
            document.addEventListener('keyup', e => move[e.key.toLowerCase()] = false);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            let moved = false;
            if (move.w) { myPlayer.position.z -= 0.1; moved = true; }
            if (move.s) { myPlayer.position.z += 0.1; moved = true; }
            if (move.a) { myPlayer.position.x -= 0.1; moved = true; }
            if (move.d) { myPlayer.position.x += 0.1; moved = true; }

            camera.position.x = myPlayer.position.x;
            camera.position.z = myPlayer.position.z + 5;

            // Eigene Position senden
            if (moved && conn) {
                conn.send({ type: 'pos', x: myPlayer.position.x, z: myPlayer.position.z });
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
